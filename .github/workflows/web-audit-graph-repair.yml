name: DeltaGrid Web Audit Graph Repair

on:
  push:
    branches:
      - autopilot/web-audit-graph-repair
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-audit-graph-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.18.1"
          "package-manager-cache": false

      - name: Regenerate dependency lock from manifest
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- web/package-lock.json; then
            echo "LOCKFILE_CHANGED=false"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "Regenerate patched web dependency lock"
          git push origin HEAD:autopilot/web-audit-graph-repair

      - name: Install locked dependency graph
        working-directory: web
        run: npm run install:locked-safe

      - name: Require zero npm audit findings
        working-directory: web
        run: npm audit --audit-level=low

      - name: Run web and founder acceptance
        working-directory: web
        run: npm run check

      - name: Run dependency-free browser acceptance
        working-directory: web
        run: node scripts/verify-browser-acceptance.mjs

      - name: Inspect founder Worker dry-run bundle
        run: node web/scripts/verify-founder-bundle.mjs /tmp/deltagrid-founder-worker/worker.js
