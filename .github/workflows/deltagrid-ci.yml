name: DeltaGrid CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offchain-tests:
    name: offchain-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out submitted repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate submitted diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          valid_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
          }
          zero_sha="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request)
              valid_sha "$PR_BASE_SHA"
              valid_sha "$PR_HEAD_SHA"
              git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
              ;;
            push)
              valid_sha "$PUSH_BEFORE_SHA"
              valid_sha "$HEAD_SHA"
              if [[ "$PUSH_BEFORE_SHA" == "$zero_sha" ]]; then
                git show -m --check --format= --no-renames "$HEAD_SHA"
              else
                git diff --check "$PUSH_BEFORE_SHA..$HEAD_SHA"
              fi
              ;;
            workflow_dispatch)
              valid_sha "$HEAD_SHA"
              git show -m --check --format= --no-renames "$HEAD_SHA"
              ;;
            *)
              exit 2
              ;;
          esac

      - name: Install declared dependencies
        run: python -m pip install --disable-pip-version-check -r offchain/requirements.txt

      - name: Print environment diagnostics
        run: |
          python --version
          python -m pip --version
          python -m pip freeze

      - name: Run complete off-chain suite
        run: |
          env -u PYTHONPATH \
          PYTHONDONTWRITEBYTECODE=1 \
          python -m pytest \
            -p no:cacheprovider \
            offchain/tests \
            -q

  web-and-founder-tests:
    name: web-and-founder-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      P1_CORE_COMMIT: "d94441f2f32fd8edc7b416beecd88b2b087d01a9"
      P1_EXPECTED_PROJECTION_SHA256: "0e13dae7cddddff1110d79630682bfbc1495f1bc23d5ea95cf15e2906fb967c4"
    steps:
      - name: Check out submitted repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.1"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check out the pinned admitted core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tushar-rawat-22/Delta_Grid
          ref: ${{ env.P1_CORE_COMMIT }}
          path: _core
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked web dependencies
        working-directory: web
        run: npm run install:locked-safe

      - name: Audit web dependency graph
        working-directory: web
        run: npm audit --audit-level=low

      - name: Verify admitted projection against the pinned core
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/p1-public-projection"
          (
            cd _core
            PYTHONDONTWRITEBYTECODE=1 python -m offchain.public_projection export --destination "$DEST"
            PYTHONDONTWRITEBYTECODE=1 python -m offchain.public_projection verify --path "$DEST"
          )
          ACTUAL="$(sha256sum "$DEST/projection.json" | awk '{print $1}')"
          test "$ACTUAL" = "$P1_EXPECTED_PROJECTION_SHA256"
          node web/scripts/verify-projection-snapshot.mjs "$DEST"
          node web/scripts/verify-projection-snapshot.mjs web/data/public-projection/v1/current
          cmp "$DEST/projection.json" web/data/public-projection/v1/current/projection.json
          cmp "$DEST/manifest.json" web/data/public-projection/v1/current/manifest.json

      - name: Run web and founder acceptance
        working-directory: web
        run: npm run check

      - name: Inspect founder Worker dry-run bundle
        run: node web/scripts/verify-founder-bundle.mjs /tmp/deltagrid-founder-worker/worker.js
