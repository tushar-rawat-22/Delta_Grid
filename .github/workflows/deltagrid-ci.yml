name: DeltaGrid CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offchain-tests:
    name: offchain-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out submitted repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate submitted diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          valid_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
          }
          zero_sha="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request)
              valid_sha "$PR_BASE_SHA"
              valid_sha "$PR_HEAD_SHA"
              git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
              ;;
            push)
              valid_sha "$PUSH_BEFORE_SHA"
              valid_sha "$HEAD_SHA"
              if [[ "$PUSH_BEFORE_SHA" == "$zero_sha" ]]; then
                git show -m --check --format= --no-renames "$HEAD_SHA"
              else
                git diff --check "$PUSH_BEFORE_SHA..$HEAD_SHA"
              fi
              ;;
            workflow_dispatch)
              valid_sha "$HEAD_SHA"
              git show -m --check --format= --no-renames "$HEAD_SHA"
              ;;
            *)
              exit 2
              ;;
          esac

      - name: Install declared dependencies
        run: python -m pip install --disable-pip-version-check -r offchain/requirements.txt

      - name: Print environment diagnostics
        run: |
          python --version
          python -m pip --version
          python -m pip freeze

      - name: Run complete off-chain suite
        run: |
          env -u PYTHONPATH \
          PYTHONDONTWRITEBYTECODE=1 \
          python -m pytest \
            -p no:cacheprovider \
            offchain/tests \
            -q
