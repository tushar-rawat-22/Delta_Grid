name: Browser Offline Recovery

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-recovery:
    name: offline-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - name: Check out submitted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.18.1"
          "package-manager-cache": false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked web dependencies
        working-directory: web
        run: npm run install:locked-safe

      - name: Build public observer
        working-directory: web
        run: npm run build:public

      - name: Prove offline continuity and recovery
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          node scripts/verify-browser-offline-recovery.mjs
