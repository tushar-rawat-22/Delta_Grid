name: DeltaGrid Live Public Boundary

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: live-public-boundary-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-boundary:
    name: verify-live-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DELTAGRID_PUBLIC_BASE: https://deltagrid-observer.tushar142004.workers.dev
      DELTAGRID_FOUNDER_BASE: https://deltagrid-founder-gateway.tushar142004.workers.dev
    steps:
      - name: Check out submitted repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify public availability and founder isolation
        shell: bash
        run: |
          set -euo pipefail
          bash web/scripts/verify-live-boundary.sh | tee "$RUNNER_TEMP/live-boundary.txt"

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## DeltaGrid live public/private boundary"
            echo
            echo "Checked public observer: \`$DELTAGRID_PUBLIC_BASE\`"
            echo
            echo "Checked anonymous founder surfaces under: \`$DELTAGRID_FOUNDER_BASE\`"
            echo
            if [ -f "$RUNNER_TEMP/live-boundary.txt" ]; then
              echo '```text'
              cat "$RUNNER_TEMP/live-boundary.txt"
              echo '```'
            else
              echo "Verifier did not produce an output file. Inspect the failed verification step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify-production-parity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: verify-production-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DELTAGRID_PUBLIC_BASE: https://deltagrid-observer.tushar142004.workers.dev
      PARITY_TRIGGER: ${{ github.event_name }}
    steps:
      - name: Check out current main
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Observe live observer release identity
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          expected="{\"release_sha\":\"$expected_sha\"}"
          release_url="$DELTAGRID_PUBLIC_BASE/deltagrid-release.json?production_parity=$expected_sha"
          release_file="$RUNNER_TEMP/live-release-identity.json"
          http_status="$(curl --silent --show-error \
            --output "$release_file" \
            --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            --header 'Cache-Control: no-cache' \
            "$release_url" || true)"
          observed="$(cat "$release_file" 2>/dev/null || true)"

          printf '%s\n' "$expected_sha" > "$RUNNER_TEMP/expected-main-sha.txt"
          printf '%s\n' "${http_status:-000}" > "$RUNNER_TEMP/live-release-http-status.txt"

          if [ "$http_status" != "200" ]; then
            printf '%s\n' "UNVERIFIED" > "$RUNNER_TEMP/production-parity-state.txt"
            message="release marker returned HTTP ${http_status:-000}; production revision is unverified"
            if [ "$PARITY_TRIGGER" = "workflow_dispatch" ]; then
              echo "FAIL: $message" >&2
              exit 1
            fi
            echo "::warning title=DeltaGrid production parity unavailable::$message"
            echo "PUBLIC_PRODUCTION_PARITY=UNVERIFIED"
            exit 0
          fi

          if [ "$observed" != "$expected" ]; then
            printf '%s\n' "DRIFT" > "$RUNNER_TEMP/production-parity-state.txt"
            message="live release marker does not match current main"
            if [ "$PARITY_TRIGGER" = "workflow_dispatch" ]; then
              echo "FAIL: $message" >&2
              echo "expected=$expected" >&2
              echo "observed=$observed" >&2
              exit 1
            fi
            echo "::warning title=DeltaGrid production drift::$message"
            echo "expected=$expected"
            echo "observed=$observed"
            echo "PUBLIC_PRODUCTION_PARITY=DRIFT"
            exit 0
          fi

          printf '%s\n' "PASS" > "$RUNNER_TEMP/production-parity-state.txt"
          echo "PUBLIC_PRODUCTION_PARITY=PASS"

      - name: Publish production parity summary
        if: always()
        shell: bash
        run: |
          {
            echo "## DeltaGrid public production parity"
            echo
            if [ -f "$RUNNER_TEMP/expected-main-sha.txt" ]; then
              echo "Current main: \`$(cat "$RUNNER_TEMP/expected-main-sha.txt")\`"
              echo
            fi
            if [ -f "$RUNNER_TEMP/production-parity-state.txt" ]; then
              echo "Parity state: \`$(cat "$RUNNER_TEMP/production-parity-state.txt")\`"
              echo
            fi
            if [ -f "$RUNNER_TEMP/live-release-http-status.txt" ]; then
              echo "Release marker HTTP status: \`$(cat "$RUNNER_TEMP/live-release-http-status.txt")\`"
              echo
            fi
            if [ -s "$RUNNER_TEMP/live-release-identity.json" ]; then
              echo "Live release marker:"
              echo '```json'
              cat "$RUNNER_TEMP/live-release-identity.json"
              echo '```'
            else
              echo "Live release marker could not be read."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
