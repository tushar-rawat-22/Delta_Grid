name: DeltaGrid Public Observer Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-observer-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: public-observer-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: public-production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      RELEASE_SHA: ${{ inputs.release_sha }}
      DELTAGRID_PUBLIC_BASE: https://deltagrid-observer.tushar142004.workers.dev

    steps:
      - name: Validate requested release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be an exact lowercase 40-character Git commit"
            exit 1
          }

      - name: Check out exact requested commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require requested commit to equal current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" || {
            echo "Refusing to deploy a commit that is not current main"
            exit 1
          }
          test -z "$(git status --porcelain)"

      - name: Set up Node 24
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.18.1"
          package-manager-cache: false

      - name: Install locked web dependencies
        working-directory: web
        run: npm run install:locked-safe

      - name: Audit release dependency graph
        working-directory: web
        run: npm audit --audit-level=low

      - name: Run complete web and founder release gate
        working-directory: web
        run: npm run check

      - name: Re-assert static public deployment boundary
        working-directory: web
        run: npm run verify:public-deploy

      - name: Bind public build to requested release
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          printf '{"release_sha":"%s"}\n' "$RELEASE_SHA" > out/deltagrid-release.json
          test "$(cat out/deltagrid-release.json)" = "{\"release_sha\":\"$RELEASE_SHA\"}"

      - name: Deploy exact public observer commit
        working-directory: web
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deploy \
            --config wrangler.jsonc \
            --strict \
            --message "DeltaGrid public observer ${RELEASE_SHA}"

      - name: Record Cloudflare deployment state
        working-directory: web
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deployments status \
            --config wrangler.jsonc \
            | tee "$RUNNER_TEMP/public-deployment.txt"
          ./node_modules/.bin/wrangler versions list \
            --json \
            --config wrangler.jsonc \
            > "$RUNNER_TEMP/public-versions.json"

      - name: Prove exact release is live
        shell: bash
        run: |
          set -euo pipefail
          expected="{\"release_sha\":\"$RELEASE_SHA\"}"
          live=""
          for attempt in $(seq 1 12); do
            live="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              "$DELTAGRID_PUBLIC_BASE/deltagrid-release.json" || true)"
            if [ "$live" = "$expected" ]; then
              printf '%s\n' "$live" | tee "$RUNNER_TEMP/public-release-identity.json"
              echo "PUBLIC_RELEASE_IDENTITY=PASS"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "FAIL: deployed public observer does not report requested release SHA" >&2
              echo "expected=$expected" >&2
              echo "observed=$live" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify live public/private boundary after release
        shell: bash
        run: |
          set -euo pipefail
          bash web/scripts/verify-live-boundary.sh | tee "$RUNNER_TEMP/live-boundary.txt"

      - name: Publish release provenance summary
        if: always()
        shell: bash
        run: |
          {
            echo "## DeltaGrid Public Observer release"
            echo
            echo "Requested commit: \`$RELEASE_SHA\`"
            echo
            echo "Workflow run: \`${GITHUB_RUN_ID}\`"
            echo
            if [ -f "$RUNNER_TEMP/public-release-identity.json" ]; then
              echo "### Live release identity"
              echo '```json'
              cat "$RUNNER_TEMP/public-release-identity.json"
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/public-deployment.txt" ]; then
              echo "### Cloudflare deployment"
              echo '```text'
              cat "$RUNNER_TEMP/public-deployment.txt"
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/public-versions.json" ]; then
              echo "### Recent Worker versions"
              echo '```json'
              cat "$RUNNER_TEMP/public-versions.json"
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/live-boundary.txt" ]; then
              echo "### Live public/private boundary"
              echo '```text'
              cat "$RUNNER_TEMP/live-boundary.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
